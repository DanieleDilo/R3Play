<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dettaglio Articolo - R3Play</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="fade-in">
    <nav class="navbar">
        <div class="navbar-content">
            <a th:href="@{/}" class="logo">R3Play</a>
            <div class="nav-actions">
                <a th:href="@{/}" class="btn btn-outline">Torna alla Vetrina</a>
            </div>
        </div>
    </nav>

    <div class="container" style="margin-top: 4rem; margin-bottom: 4rem;">
        <div class="fade-in delay-1" style="max-width: 900px; display: flex; flex-wrap: wrap; gap: 3rem; padding: 3rem; background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow); border: 1px solid var(--border);">
            <div style="flex: 1; min-width: 300px;">
                <img th:if="${articolo.urlFoto != null}" th:src="@{${articolo.urlFoto}}" style="width: 100%; height: auto; max-height: 400px; object-fit: cover; border-radius: var(--radius-lg); border: 1px solid rgba(255,255,255,0.08); box-shadow: var(--shadow);">
                <div th:unless="${articolo.urlFoto != null}" style="width: 100%; height: 350px; display:flex; align-items:center; justify-content:center; background: rgba(255,255,255,0.05); border-radius: var(--radius-lg); border: 1px solid rgba(255,255,255,0.08); color: var(--text-light);">
                    📷 Nessuna Foto
                </div>
            </div>

            <div style="flex: 1; min-width: 300px; display: flex; flex-direction: column;">
                <h1 th:text="${articolo.nome}" style="font-size: 2.2rem; font-weight: 800; margin-bottom: 0.5rem; color: var(--text); letter-spacing: -1px; background: linear-gradient(45deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">Nome Articolo</h1>
                <p th:text="${#numbers.formatDecimal(articolo.prezzo, 1, 2)} + ' €'" style="font-size: 2rem; color: var(--primary); font-weight: 800; margin-bottom: 2rem;"></p>
                <div style="background: rgba(255,255,255,0.02); padding: 1.5rem; border-radius: var(--radius-md); border: 1px solid var(--border); margin-bottom: 2rem; flex-grow: 1;">
                    <h4 style="color: var(--text-light); text-transform: uppercase; letter-spacing: 2px; font-size: 0.8rem; margin-bottom: 0.8rem;">Descrizione dell'annuncio</h4>
                    <p th:text="${articolo.descrizione}" style="line-height: 1.7; color: var(--text);"></p>
                </div>
                <div style="padding-top: 1.5rem; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between;">
                    <div>
                        <span style="color: var(--text-light); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px;">Venduto da</span> <br>
                        <a th:if="${articolo.venditore != null}" 
                           th:href="@{'/utente/' + ${articolo.venditore.id}}" 
                           style="color: var(--text); font-weight: 700; font-size: 1.2rem; transition: var(--transition);">
                           <span th:text="${articolo.venditore.nome + ' ' + articolo.venditore.cognome}">Nome Venditore</span>
                        </a>
                        <span th:unless="${articolo.venditore != null}" style="color: var(--text); font-weight: 700; font-size: 1.2rem;">Utente R3Play</span>
                    </div>
                    <a th:if="${articolo.venditore != null and (emailLoggata == null or emailLoggata != articolo.venditore.email)}" th:href="@{'/utente/' + ${articolo.venditore.id}}" class="btn btn-primary" style="padding: 0.5rem 1.2rem; font-size: 0.85rem;">
                        Visita Profilo
                    </a>
                    <span th:if="${articolo.venditore != null and emailLoggata != null and emailLoggata == articolo.venditore.email}" class="btn btn-ghost" style="padding: 0.5rem 1.2rem; font-size: 0.85rem; opacity: 0.7; cursor: default;">
                        Il tuo profilo
                    </span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
