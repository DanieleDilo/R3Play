<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifica Articolo - R3Play</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="fade-in">
    <nav class="navbar">
        <div class="navbar-content">
            <a th:href="@{/}" class="logo">R3Play</a>
            <div class="nav-actions">
                <a th:href="@{/vetrina}" class="btn btn-ghost">Vetrina</a>
                <a th:href="@{/armadio}" class="btn btn-secondary">Il Mio Armadio</a>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="logout-button">Esci</button>
                </form>
            </div>
        </div>
    </nav>

    <section class="section">
        <div class="container">
            <div class="hero">
                <h1 class="hero-title">Modifica Articolo</h1>
                <p class="hero-subtitle">Aggiorna i dettagli del tuo annuncio sportivo</p>
            </div>

            <div class="card" style="max-width: 600px; margin: 0 auto;">
                <div class="card-content">
                    <form th:action="@{'/articolo/modifica/' + ${articolo.id}}" th:object="${articolo}" method="POST" enctype="multipart/form-data">
                        <input type="hidden" th:field="*{id}">
                        <input type="hidden" th:field="*{urlFoto}">

                        <div class="form-group">
                            <label for="nome" class="form-label">Nome Articolo</label>
                            <input type="text" id="nome" th:field="*{nome}" required class="form-input">
                        </div>

                        <div class="form-group">
                            <label for="descrizione" class="form-label">Descrizione</label>
                            <textarea id="descrizione" th:field="*{descrizione}" rows="4" required class="form-textarea"></textarea>
                        </div>

                        <div class="form-group">
                            <label for="prezzo" class="form-label">Prezzo (€)</label>
                            <input type="number" step="0.01" id="prezzo" th:field="*{prezzo}" required class="form-input">
                        </div>

                        <div class="form-group">
                            <label for="categoria" class="form-label">Categoria</label>
                            <select id="categoria" th:field="*{categoria}" required class="form-select">
                                <option value="" disabled selected>Seleziona una categoria</option>
                                <option th:each="cat : ${categorie}" th:value="${cat.id}" th:text="${cat.nome}"></option>
                            </select>
                        </div>

                        <div class="form-actions">
                            <a th:href="@{/armadio}" class="btn btn-ghost">Annulla</a>
                            <button type="submit" class="btn btn-primary">Salva Modifiche</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
