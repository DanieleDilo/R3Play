<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Modifica Articolo - R3Play</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="form-page fade-in-up">
    <div class="form-card">
        <div class="page-header">
            <h2>Modifica Articolo ✏️</h2>
            <p>Aggiorna i dettagli del tuo annuncio sportivo</p>
        </div>

        <form th:action="@{'/articolo/modifica/' + ${articolo.id}}" th:object="${articolo}" method="POST" enctype="multipart/form-data">

            <input type="hidden" th:field="*{id}">
            <input type="hidden" th:field="*{urlFoto}">

            <div class="form-group">
                <label for="nome">Nome Articolo:</label>
                <input type="text" id="nome" th:field="*{nome}" required>
            </div>

            <div class="form-group">
                <label for="descrizione">Descrizione:</label>
                <textarea id="descrizione" th:field="*{descrizione}" rows="3" required></textarea>
            </div>

            <div class="form-group">
                <label for="prezzo">Prezzo (€):</label>
                <input type="number" step="0.01" id="prezzo" th:field="*{prezzo}" required>
            </div>

            <div class="form-group">
                <label for="fileImmagine">Aggiungi altre foto:</label>
                <input type="file" id="fileImmagine" name="fileImmagine" accept="image/*" multiple>
                <p class="help-text">Le foto già presenti verranno mantenute automaticamente.</p>
            </div>

            <div class="form-action-row">
                <a th:href="@{/armadio}" class="btn btn-ghost">Annulla</a>
                <button type="submit" class="btn-submit">Salva Modifiche</button>
            </div>
        </form>
    </div>
</body>
</html>
