<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Accedi - R3Play</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-shell fade-in-up">
    <div class="auth-card">
        <h2>R3Play 🏀</h2>
        <p>Bentornato! Accedi al tuo account.</p>

        <div th:if="${param.error}" class="alert-error">
            Email o Password errati. Riprova.
        </div>
        <div th:if="${param.logout}" class="alert-success">
            Ti sei disconnesso con successo.
        </div>
        <div th:if="${param.registrato}" class="alert-success">
            Registrazione completata! Ora puoi accedere.
        </div>

        <form th:action="@{/login}" method="POST">
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required placeholder="tu@email.com">
            </div>

            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn-submit">Accedi</button>
        </form>

        <div class="divider"><span>OPPURE</span></div>

        <a th:href="@{/oauth2/authorization/google}" class="btn-google">Accedi con Google</a>

        <p class="help-text">
            Non hai un account? <a th:href="@{/registrati}" class="btn-link">Registrati ora</a>
        </p>
    </div>
</body>
</html>
