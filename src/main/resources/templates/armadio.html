<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Il Mio Armadio - R3Play</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="fade-in-up">
    <nav class="navbar">
        <a th:href="@{/}" class="logo">R3Play</a>
        <div class="nav-actions">
            <a th:href="@{/vetrina}" class="btn btn-ghost">Vetrina</a>
            <a th:href="@{/articolo/nuovo}" class="btn btn-primary">Vendi</a>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="logout-button">Esci</button>
            </form>
        </div>
    </nav>

    <div class="container">
        <div class="user-header">
            <div class="user-info">
                <span class="eyebrow">La tua Dashboard</span>
                <h1 th:text="'Ciao, ' + ${utente.nome} + '!'">Ciao, Daniele!</h1>
            </div>
            <div class="stats-container">
                <div class="stat-box">
                    <span class="stat-value" th:text="${mediaValutazioni}">0.0</span>
                    <span class="stat-label">Media Stelle ⭐</span>
                </div>
                <div class="stat-box">
                    <span class="stat-value" th:text="${mieiArticoli.size()}">0</span>
                    <span class="stat-label">Articoli Online</span>
                </div>
            </div>
        </div>

        <h2 class="section-title">I tuoi Annunci</h2>

        <div class="grid" th:if="${not #lists.isEmpty(mieiArticoli)}">
            <div class="item-card" th:each="art : ${mieiArticoli}">
               <img th:if="${art.urlFoto != null}" th:src="${art.urlFoto}" class="item-img" alt="Foto Prodotto">
                <div th:unless="${art.urlFoto != null}" class="item-img placeholder">Nessuna Foto</div>
                <div class="item-content">
                    <h3 th:text="${art.nome}" class="item-title">Nome</h3>
                    <p class="item-price" th:text="${art.prezzo} + ' €'">0.00 €</p>

                    <div class="actions">
                        <a th:href="@{'/articolo/modifica/' + ${art.id}}" class="btn btn-edit">Modifica</a>
                        <a th:href="@{'/articolo/elimina/' + ${art.id}}"
                            class="btn btn-delete"
                            onclick="return confirm('Sei sicuro di voler eliminare questo annuncio?')">Elimina</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="empty-state" th:if="${#lists.isEmpty(mieiArticoli)}">
            <h3>Non hai ancora caricato nulla.</h3>
            <p>Inizia a vendere i tuoi articoli sportivi oggi stesso!</p>
            <a th:href="@{/articolo/nuovo}" class="btn btn-primary">Vendi il primo articolo</a>
        </div>
    </div>

</body>
</html>
