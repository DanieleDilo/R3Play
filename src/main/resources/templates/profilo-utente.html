<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profilo Utente - R3Play</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="fade-in">
    <nav class="navbar">
        <div class="navbar-content">
            <a th:href="@{/}" class="logo">R3Play</a>
            <div class="nav-actions">
                <div sec:authorize="isAnonymous()">
                    <a th:href="@{/login}" class="btn btn-outline">Accedi</a>
                    <a th:href="@{/registrati}" class="btn btn-outline">Registrati</a>
                </div>
                <div sec:authorize="isAuthenticated()" style="display: flex; gap: 10px;">
                    <a th:href="@{/armadio}" class="btn btn-outline">Il Mio Armadio</a>
                    <form th:action="@{/logout}" method="post" style="display: inline; margin: 0;">
                        <button type="submit" class="btn btn-outline">Esci</button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <section class="page-hero compact-hero">
        <h1 class="section-title">Profilo di <span th:text="${venditore.nome ?: 'Utente'}"></span></h1>
        <div class="stats-row fade-in delay-1">
            <div class="stat-item">
                <span class="stat-value" th:text="${mediaValutazioni}">0.0</span>
                <span class="stat-label">Feedback ⭐</span>
            </div>
        </div>
    </section>

    <div class="container fade-in delay-2" style="max-width: 920px;">
        <div class="grid compact-grid" th:if="${not #lists.isEmpty(articoliVenditore)}">
            <div class="product-card compact-card" th:each="art : ${articoliVenditore}" th:onclick="'window.location.href=\'/articolo/' + ${art.id} + '\''">
                <img th:if="${art.urlFoto != null}" th:src="@{${art.urlFoto}}" alt="Foto Articolo" class="product-image compact-image">
                <div th:unless="${art.urlFoto != null}" class="product-image compact-image placeholder-image" style="display:flex; align-items:center; justify-content:center; background:#1e1e1e;">📷 Nessuna Foto</div>
                <div class="product-content compact-content">
                    <h3 class="product-title" th:text="${art.nome}">Nome Articolo</h3>
                    <p class="product-price" th:text="${#numbers.formatDecimal(art.prezzo, 1, 2)} + ' €'">0.00 €</p>
                </div>
            </div>
        </div>

        <div th:if="${utente != null and utente.id != venditore.id}" class="form-box fade-in delay-3" style="margin-top: 4rem;">
            <h3 style="margin-bottom: 1.5rem; color: var(--primary-neon);">Lascia un feedback</h3>
            <form th:action="@{'/utente/' + ${venditore.id} + '/recensione'}" th:object="${nuovaRecensione}" method="POST">
                <div class="form-group">
                    <label class="form-label">Valutazione (1-5)</label>
                    <select th:field="*{valutazione}" class="form-input" style="background: rgba(0,0,0,0.5);" required>
                        <option value="5">⭐⭐⭐⭐⭐ Eccellente</option>
                        <option value="4">⭐⭐⭐⭐ Buono</option>
                        <option value="3">⭐⭐⭐ Normale</option>
                        <option value="2">⭐⭐ Scarso</option>
                        <option value="1">⭐ Pessimo</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Commento</label>
                    <textarea th:field="*{testo}" class="form-input" rows="3" placeholder="Com'è andata la trattativa?" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Pubblica Feedback</button>
            </form>
        </div>

        <div class="recensioni-section fade-in delay-3" style="margin-top: 4rem; margin-bottom: 5rem;">
            <h2 style="color: var(--primary-neon); margin-bottom: 2rem; text-align: center;">Cosa dicono di <span th:text="${venditore.nome ?: 'questo utente'}"></span></h2>
            
            <div th:if="${venditore.recensioniRicevute != null and !venditore.recensioniRicevute.isEmpty()}">
                <div class="review-card" th:each="rec : ${venditore.recensioniRicevute}">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                        <div style="display: flex; align-items: center; gap: 1rem;">
                            <span style="font-size: 1.2rem; color: #ffd700; display: inline-flex; gap: 0.15rem;">
                                <span th:each="i : ${#numbers.sequence(1, rec.valutazione)}">★</span>
                            </span>
                            
                            <strong style="color: var(--text-light); font-size: 0.95rem;">da 
                                <span th:text="${rec.autore != null ? rec.autore.nome + ' ' + rec.autore.cognome : 'Utente'}" style="color: var(--primary-neon);">Utente</span>
                            </strong>
                        </div>
                    </div>
                    <p style="color: var(--text-main); font-size: 1rem; line-height: 1.6;" th:text="${rec.testo}">Testo recensione...</p>
                    
                    <div th:if="${utente != null and utente.id == rec.autore.id}" style="margin-top: 1rem; text-align: right;">
                        <a th:href="@{'/recensione/elimina/' + ${rec.id}}" style="color: #ff4d4d; font-size: 0.85rem; text-decoration: underline;" onclick="return confirm('Sicuro di voler eliminare questo feedback?')">Elimina Feedback</a>
                    </div>
                </div>
            </div>
            
            <div th:unless="${venditore.recensioniRicevute != null and !venditore.recensioniRicevute.isEmpty()}" style="text-align: center; color: var(--text-dim); padding: 2rem; border: 1px dashed var(--glass-border); border-radius: var(--radius-md);">
                Nessun feedback ricevuto. Sii il primo a recensire!
            </div>
        </div>
    </div>
</body>
</html>
