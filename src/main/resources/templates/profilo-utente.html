<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profilo Utente - R3Play</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="fade-in">
    <nav class="navbar">
        <div class="navbar-content">
            <a th:href="@{/}" class="logo">R3Play</a>
            <div class="nav-actions">
                <div sec:authorize="isAnonymous()">
                    <a th:href="@{/login}" class="btn btn-outline">Accedi</a>
                    <a th:href="@{/registrati}" class="btn btn-outline">Registrati</a>
                </div>
                <div sec:authorize="isAuthenticated()" style="display: flex; gap: 10px;">
                    <a th:href="@{/armadio}" class="btn btn-outline">Il Mio Armadio</a>
                    <form th:action="@{/logout}" method="post" style="display: inline; margin: 0;">
                        <button type="submit" class="btn btn-outline">Esci</button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <section class="page-hero compact-hero">
        <h1 class="section-title">Profilo di <span th:text="${venditore.nome ?: 'Utente'}"></span></h1>
        <div class="stats-row fade-in delay-1">
            <div class="stat-item">
                <span class="stat-value" th:text="${mediaValutazioni}">0.0</span>
                <span class="stat-label">Feedback ⭐</span>
            </div>
        </div>
    </section>

    <div class="container fade-in delay-2" style="max-width: 920px;">
        <div class="grid compact-grid" th:if="${not #lists.isEmpty(articoliVenditore)}">
            <div class="product-card compact-card" th:each="art : ${articoliVenditore}" th:onclick="'window.location.href=\'/articolo/' + ${art.id} + '\''">
                <img th:if="${art.urlFoto != null}" th:src="@{${art.urlFoto}}" alt="Foto Articolo" class="product-image compact-image">
                <div th:unless="${art.urlFoto != null}" class="product-image compact-image placeholder-image" style="display:flex; align-items:center; justify-content:center; background:#1e1e1e;">📷 Nessuna Foto</div>
                <div class="product-content compact-content">
                    <h3 class="product-title" th:text="${art.nome}">Nome Articolo</h3>
                    <p class="product-price" th:text="${#numbers.formatDecimal(art.prezzo, 1, 2)} + ' €'">0.00 €</p>
                    <div th:if="${(utente != null and venditore != null and utente.email == venditore.email) or #authorization.expression('hasAuthority(''ROLE_ADMIN'')')}" class="mt-3" style="display:flex; gap: 10px; margin-top: auto;" onclick="event.stopPropagation()">
                        <a th:href="@{'/articolo/modifica/' + ${art.id}}" class="btn btn-secondary compact-btn" style="flex:1; text-align:center;">Modifica</a>
                        <a th:href="@{'/articolo/elimina/' + ${art.id}}" class="btn btn-outline compact-btn" style="flex:1; border-color: #ff4d4d; color: #ff4d4d; text-align:center;" onclick="return confirm('Eliminare questo annuncio?')">Elimina</a>
                    </div>
                </div>
            </div>
        </div>

    <!-- React + Babel (CDN, no build step richiesto) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel" src="/js/recensioni.jsx"></script>
</body>
</html>
