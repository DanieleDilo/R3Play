<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrati - R3Play</title>
    <style>
        /* Usiamo lo stesso stile della pagina di login per coerenza */
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        .form-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .btn-submit { width: 100%; padding: 12px; background-color: #f0ad4e; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-submit:hover { background-color: #ec971f; }
        .alert-error { color: #d9534f; background: #f2dede; padding: 10px; border-radius: 5px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2 style="color: #f0ad4e; margin-top: 0;">Unisciti a R3Play 🚀</h2>
        <p>Crea il tuo account in pochi secondi.</p>

        <div th:if="${errore != null}" class="alert-error" th:text="${errore}"></div>

        <form th:action="@{/registrati}" th:object="${utente}" method="POST">
            
            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" th:field="*{nome}" required>
            </div>

            <div class="form-group">
                <label for="cognome">Cognome:</label>
                <input type="text" id="cognome" th:field="*{cognome}" required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" th:field="*{email}" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" th:field="*{password}" required>
            </div>

            <button type="submit" class="btn-submit">Registrami</button>
        </form>

        <p style="margin-top: 25px; font-size: 0.9em;">
            Hai già un account? <a th:href="@{/login}" style="color: #f0ad4e; font-weight: bold;">Torna al Login</a>
        </p>
    </div>

</body>
</html>
