<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrati - R3Play</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-shell fade-in-up">
    <div class="auth-card">
        <h2>Unisciti a R3Play 🚀</h2>
        <p>Crea il tuo account in pochi secondi.</p>

        <div th:if="${errore != null}" class="alert-error" th:text="${errore}"></div>

        <form th:action="@{/registrati}" th:object="${utente}" method="POST">

            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" th:field="*{nome}" required>
            </div>

            <div class="form-group">
                <label for="cognome">Cognome:</label>
                <input type="text" id="cognome" th:field="*{cognome}" required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" th:field="*{email}" required>
            </div>

            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" th:field="*{password}" required>
            </div>

            <button type="submit" class="btn-submit">Registrami</button>
        </form>

        <p class="help-text">
            Hai già un account? <a th:href="@{/login}" class="btn-link">Torna al Login</a>
        </p>
    </div>
</body>
</html>
