<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benvenuto - R3Play</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="fade-in">
    <nav class="navbar">
        <div class="navbar-content">
            <a th:href="@{/}" class="logo">R3Play</a>
        </div>
    </nav>

    <section class="page-hero welcome-hero">
        <div class="floating-elements">
            <div class="floating-circle"></div>
            <div class="floating-circle small"></div>
            <div class="floating-triangle"></div>
        </div>
        <h1 class="section-title" th:if="${nomeLoggato != null}" th:text="'Bentornato, ' + ${nomeLoggato} + '!'">R3Play</h1>
        <h1 class="section-title" th:unless="${nomeLoggato != null}">R3Play</h1>
        <p style="color: var(--text-light); font-size: 1.15rem; max-width: 600px; margin: 0 auto 2.5rem; line-height: 1.6;">
            Il marketplace innovativo dedicato agli sportivi. Compra, vendi e dai nuova vita alla tua attrezzatura sportiva in modo semplice e sicuro.
        </p>
        <div class="hero-actions">
            <a th:href="@{/vetrina}" class="btn btn-ghost">Esplora</a>
            <a th:href="@{/login}" class="btn btn-primary">Accedi</a>
            <a th:href="@{/registrati}" class="btn btn-secondary">Registrati</a>
        </div>
    </section>
</body>
</html>
