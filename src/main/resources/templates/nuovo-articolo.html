<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Vendi un Articolo - R3Play</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body class="fade-in-up">
    <div class="welcome-shell form-page">
        <div class="form-card">
            <div class="page-header">
                <span class="eyebrow">Vendi con facilità</span>
                <h2>Metti in vendita il tuo articolo</h2>
                <p>Compila i dettagli principali e carica immagini di qualità. Più informazioni dai, più velocemente sarà venduto.</p>
            </div>

            <form th:action="@{/articolo/nuovo}" th:object="${articolo}" method="POST" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="nome">Nome Articolo</label>
                    <input type="text" id="nome" th:field="*{nome}" placeholder="Es. Racchetta da Tennis" required>
                </div>

                <div class="form-group">
                    <label for="descrizione">Descrizione</label>
                    <textarea id="descrizione" th:field="*{descrizione}" rows="4" placeholder="Condizioni, marca, dettagli..." required></textarea>
                </div>

                <div class="form-group">
                    <label for="prezzo">Prezzo (€)</label>
                    <input type="number" step="0.01" id="prezzo" th:field="*{prezzo}" placeholder="Es. 25.50" required>
                </div>

                <div class="form-group">
                    <label for="fileImmagine">Carica fino a 5 foto</label>
                    <input type="file" id="fileImmagine" name="fileImmagine" accept="image/*" multiple>
                    <p class="help-text">Mostra l'articolo da più angolazioni per attirare più compratori.</p>
                </div>

                <div class="form-action-row">
                    <button type="submit" class="btn btn-primary">Pubblica Annuncio</button>
                    <a th:href="@{/vetrina}" class="btn btn-ghost">Annulla</a>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
