<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Vetrina - R3Play</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; text-align: center; }
        h1 { color: #6DB33F; }
        .header-actions { margin-bottom: 30px; }
        .btn-nuovo { padding: 10px 20px; background-color: #6DB33F; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; }
        .btn-nuovo:hover { background-color: #5aa032; }
        
        /* Griglia per gli articoli */
        .griglia-articoli { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
        
        /* Stile della singola "Card" */
        .card-articolo { background: white; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 250px; overflow: hidden; text-align: left; transition: transform 0.2s;}
        .card-articolo:hover { transform: translateY(-5px); }
        .card-foto { width: 100%; height: 200px; object-fit: cover; background-color: #eee; }
        .card-corpo { padding: 15px; }
        .card-titolo { margin: 0 0 10px 0; font-size: 1.2em; color: #333; }
        .card-prezzo { margin: 0; color: #6DB33F; font-size: 1.4em; font-weight: bold; }
        .card-desc { font-size: 0.9em; color: #666; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .btn-modifica { display: block; text-align: center; margin-top: 10px; padding: 8px; background-color: #f0ad4e; color: white; text-decoration: none; border-radius: 5px; font-size: 0.9em; font-weight: bold; }
        .btn-modifica:hover { background-color: #ec971f; }
    </style>
</head>
<body>

    <h1>Benvenuto in R3Play 🚀</h1>
    <div class="header-actions">
        <a th:href="@{/articolo/nuovo}" class="btn-nuovo">+ Vendi un Articolo</a>
    </div>

    <div class="griglia-articoli">
        
        <div class="card-articolo" th:each="articolo : ${articoli}">
            
            <img th:if="${articolo.urlFoto != null}" th:src="@{${articolo.urlFoto}}" alt="Foto Articolo" class="card-foto">
            <div th:unless="${articolo.urlFoto != null}" class="card-foto" style="display:flex; align-items:center; justify-content:center; color:#999;">Nessuna Foto</div>
            
            <div class="card-corpo">
                <h3 class="card-titolo" th:text="${articolo.nome}">Nome Articolo</h3>
                <p class="card-desc" th:text="${articolo.descrizione}">Descrizione breve...</p>
                <p class="card-prezzo" th:text="${articolo.prezzo} + ' €'">0.00 €</p>
                <a th:href="@{'/articolo/modifica/' + ${articolo.id}}" class="btn-modifica">✏️ Modifica</a>
            </div>
        </div>

    </div>

</body>
</html>
